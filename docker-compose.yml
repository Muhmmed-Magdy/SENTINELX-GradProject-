# AI SOC Dashboard — Docker Compose
#
# Quick start (development / local demo):
#   docker compose up --build -d
#
# Production — you MUST set these two variables in backend/.env before running:
#   SECRET_KEY   — generate with: python -c "import secrets; print(secrets.token_hex(32))"
#   CORS_ORIGINS — set to your frontend HTTPS origin, e.g. https://soc.example.com
#
# Recommended: create backend/.env (see backend/.env.example) and set
# APP_ENV=production to enable fail-fast security validation at startup.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - soc-data:/data
    environment:
      DATABASE_PATH: /data/soc_dashboard.db
      UPLOAD_DIR: /data/uploads
      # APP_ENV is intentionally NOT hardcoded here so that the default
      # development mode is preserved for local use without a .env file.
      # Set APP_ENV=production in backend/.env to enable production security checks.
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  soc-data:
