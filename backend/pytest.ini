[pytest]
# Run from: backend/
# Usage:    pytest  (or: python -m pytest)
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short, readable summaries for failures and skips
addopts =
    -v
    --tb=short
    --strict-markers

# Silence noisy DeprecationWarnings from third-party libs
filterwarnings =
    ignore::DeprecationWarning:flask.*:
    ignore::DeprecationWarning:werkzeug.*:
