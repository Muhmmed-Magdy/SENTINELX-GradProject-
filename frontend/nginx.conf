server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Allow log file uploads up to 60 MB (backend MAX_UPLOAD_SIZE is 50 MB)
    client_max_body_size 60m;

    # ── API proxy ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Give AI/upload endpoints enough time to complete
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Socket.IO / WebSocket proxy ──────────────────────────────────────
    location /socket.io/ {
        proxy_pass             http://backend:8001/socket.io/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Disable buffering for real-time event streaming
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
